name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  node:
    name: Node.js ${{ matrix.node }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Run all tests with coverage (Node 22 only)
        if: matrix.node == '22'
        run: npm run coverage

      - name: Run battle tests with coverage (Node 22 only)
        if: matrix.node == '22'
        run: npm run coverage:battle

      - name: Library coverage must stay above 98% (Node 22 only)
        if: matrix.node == '22'
        run: npm run coverage:gate

      - name: Upload unit coverage to Codecov (Node 22 only)
        if: matrix.node == '22'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          flags: unit
          fail_ci_if_error: false

      - name: Upload battle coverage to Codecov (Node 22 only)
        if: matrix.node == '22'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./.battle/lcov.info
          flags: battle
          fail_ci_if_error: false

      - name: Run all tests (Node 20)
        if: matrix.node == '20'
        run: npm run test
        
      - name: Run battle tests (Node 20)
        if: matrix.node == '20'
        run: npm run battle:all

      - name: Type coverage must stay above 99%
        if: matrix.node == '22'
        run: npm run type-coverage

      - name: No dead exports
        if: matrix.node == '22'
        run: npm run check:dead

      - name: Every test file is wired to a script
        if: matrix.node == '22'
        run: npm run check:scripts

  bun:
    name: Bun — ubuntu-latest
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Runtime portability battle test (lib/ under Bun)
        run: bun run runtime-tests/battle.ts

  deno:
    name: Deno — ubuntu-latest
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Type check (lib/, deno-tests/, runtime-tests/)
        run: deno task check

      - name: Lint
        run: deno lint
        
      - name: Battle test
        run: deno task battle

      - name: Battle test — 2.1.0 feature set
        run: deno task battle:new

      - name: Battle test — CLI task table
        run: deno task battle:cli

      - name: Runtime portability battle test (lib/ under Deno)
        run: deno task battle:runtime

      - name: Unit tests
        run: deno task test:unit

      - name: Integration tests
        run: deno task test:integration
        continue-on-error: true
