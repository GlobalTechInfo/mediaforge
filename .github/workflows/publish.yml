name: Publish to npm

# Triggered automatically when Build & Release completes successfully on a tag.
# workflow_run is used because GitHub blocks release events created by GITHUB_TOKEN
# from triggering other workflows.
on:
  workflow_run:
    workflows: ["Build & Release"]
    types: [completed]
  workflow_dispatch:

jobs:
  publish:
    # Only run when upstream succeeded (or when triggered manually)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v5

      - name: Checkout release tag
        if: github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: git fetch origin "$HEAD_SHA" && git checkout FETCH_HEAD

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade NPM
        run: npm install -g npm@latest

      # The smoke test below packs and runs the published CLI, which shells out
      # to ffmpeg. GitHub's Ubuntu image does not ship it, so without this the
      # job fails at "could not run ffmpeg" and 2.2.0 never reaches npm - which
      # is exactly what happened. `build-release.yml` installs it for the same
      # reason.
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (ESM + CJS)
        run: npm run build

      # Validate the artefact before it is public. A release that is broken for
      # consumers cannot be recalled as cleanly as a failed build step.
      - name: Smoke test the packed tarball
        run: npm run smoke

      - name: Publish
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PKG_VERSION" == *-* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ""
